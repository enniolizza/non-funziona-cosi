name: Site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Official actions/checkout v6; immutable commit, verified on 2026-10-22.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Official actions/setup-node v4; immutable commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Build static site
        run: npm run build
      - name: Check versioned Pages files match the build
        run: python3 scripts/sync_pages.py --check
      - name: Check content, browser policy and local links
        run: python3 scripts/check_site.py --root _site
      - name: Check removed assets and protected Git history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_history.py
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests
      - name: Check JavaScript syntax
        run: node --check src/assets/js/carousel.js
      - name: Run browser smoke tests
        env:
          SITE_DIR: _site
        run: npm run test:browser
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"
